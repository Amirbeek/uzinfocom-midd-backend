services:
  app:
    build: .
    container_name: uzinfocom-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://orderUser:adminpassword@db:5432/Order?sslmode=disable
      REDIS_ADDR: redis:6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  db:
    image: postgres:16.3
    container_name: postgres-db
    environment:
      POSTGRES_DB: Order
      POSTGRES_USER: orderUser
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderUser -d Order"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
  migrate:
    image: migrate/migrate
    volumes:
      - ./cmd/migrate/migrations:/migrations
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://orderUser:adminpassword@db:5432/Order?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
  redis:
    image: redis:6.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - backend

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    hostname: redis-commander
    environment:
      - REDIS_HOST=redis
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - backend
volumes:
  db-data:
networks:
  backend:
    driver: bridge